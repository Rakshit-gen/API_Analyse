services:
  - type: web
    name: api-debugger
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: TEMPERATURE
        value: 0.1
      - key: MAX_TOKENS
        value: 2000
